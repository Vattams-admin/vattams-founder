name: Generate Competition Runtime Registry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/catalog-data.mjs"
      - "scripts/generate-competition-runtime-registry.mjs"
      - "scripts/prepare-competition-runtime-sources.mjs"
      - "scripts/validate-competition-runtime-coverage.mjs"
      - "scripts/publish-competition-runtime.mjs"
      - "data/competitions/**/full-bank/objective/**"
      - "data/thirukkural/**"
      - ".github/workflows/generate-competition-runtime-registry.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build reviewed Thirukkural production source package
        run: |
          node scripts/build-thirukkural-full-bank.mjs
          python3 scripts/build-thirukkural-objective-bank.py
          node scripts/build-thirukkural-age-pools.mjs
          node scripts/build-thirukkural-official-objective-local.mjs
      - name: Prepare reviewed competition runtime sources
        run: node scripts/prepare-competition-runtime-sources.mjs
      - name: Generate registry from Firestore course IDs
        env:
          FIREBASE_PROJECT_ID: vattams-academia
          VITE_FIREBASE_PROJECT_ID: vattams-academia
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/generate-competition-runtime-registry.mjs
      - name: Validate registry coverage
        run: node scripts/validate-competition-runtime-coverage.mjs
      - name: Validate all competition MCQ packages
        run: |
          set -e
          for slug in mathematics-challenge science-challenge english-challenge computer-challenge gk-challenge reasoning-challenge india-gk-championship national-quiz-championship ai-technology-challenge international-knowledge-challenge national-mathematics-championship national-science-championship national-english-championship national-aptitude-championship national-coding-challenge national-ai-challenge mega-inter-school-championship indian-classical-literature-wisdom-championship indian-language-literature-masters-series thirukkural fun-with-maths-challenge azhagu-tamil-challenge handwriting-excellence-challenge spoken-hindi-challenge; do
            node scripts/validate-competition-mcq-bank.mjs --slug "$slug"
          done
      - name: Publish validated runtime packages to Supabase Storage
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/publish-competition-runtime.mjs

      - name: Commit prepared sources and generated registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/competition-registry.json data/competitions/**/full-bank/objective/age-pools.json data/competitions/**/full-bank/objective/selection-blueprint.json
          git diff --cached --quiet && echo "Runtime sources and registry already current" && exit 0
          git commit -m "Prepare 24 competition runtime packages [skip ci]"
          git push
