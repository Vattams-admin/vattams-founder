name: Validate Assessment Blueprint Promotion

on:
  pull_request:
    paths:
      - "config/assessment-blueprint-authoring/**"
      - "config/assessment-blueprint-registry.json"
      - "scripts/promote-assessment-blueprint.mjs"
      - "scripts/validate-assessment-blueprint-registry.mjs"
      - "package.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run content:assessment:blueprint:authoring:validate -- config/assessment-blueprint-authoring/tnpsc-group-iv-vao-mock.json
      - run: npm run content:assessment:blueprint:validate
