name: Deploy Competition Mock Attempt
# Deploy the current Mock Test runtime after source fixes

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/competition-mock-attempt/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-competition-mock-attempt.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ljnfktzrjewqjxxchvud

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy competition-mock-attempt
        run: |
          supabase functions deploy competition-mock-attempt \
            --project-ref "$PROJECT_ID" \
            --use-api
