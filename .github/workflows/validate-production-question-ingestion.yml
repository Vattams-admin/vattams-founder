name: Validate Production Question Ingestion

on:
  pull_request:
    paths:
      - "config/production-question-ingestion.schema.json"
      - "config/production-question-ingestion.example.json"
      - "scripts/validate-production-question-ingestion.mjs"
      - "package.json"

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate ingestion validator syntax
        run: node --check scripts/validate-production-question-ingestion.mjs
