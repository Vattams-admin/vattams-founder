name: Validate Production Authoring Backlog

on:
  pull_request:
    paths:
      - "config/production-authoring-backlog.json"
      - "scripts/validate-production-authoring-backlog.mjs"
      - "package.json"
  push:
    branches:
      - main
    paths:
      - "config/production-authoring-backlog.json"
      - "scripts/validate-production-authoring-backlog.mjs"
      - "package.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run content:backlog:validate
