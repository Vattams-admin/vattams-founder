name: Validate Academia Master Taxonomy

on:
  pull_request:
    paths:
      - 'config/academia-master-taxonomy.json'
      - 'scripts/validate-academia-master-taxonomy.mjs'
      - 'package.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run academia:taxonomy:validate
