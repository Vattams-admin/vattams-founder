name: Validate Assessment Registry

on:
  push:
    paths:
      - 'config/assessment-registry.json'
      - 'assessments/registry.json'
      - 'config/**/assessment*.json'
      - 'content/**/assessment*.json'
      - 'scripts/validate-assessment-bank.mjs'
      - 'scripts/validate-assessment-registry.mjs'
      - 'scripts/validate-assessment-production.mjs'
      - '.github/workflows/validate-assessment-registry.yml'
  pull_request:
    paths:
      - 'config/assessment-registry.json'
      - 'config/**/assessment*.json'
      - 'content/**/assessment*.json'
      - 'scripts/validate-assessment-bank.mjs'
      - 'scripts/validate-assessment-registry.mjs'
      - '.github/workflows/validate-assessment-registry.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/validate-assessment-registry.mjs
        if: ${{ hashFiles('config/assessment-registry.json') != '' }}

      - name: Validate production assessment registry
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/validate-assessment-production.mjs
