name: Validate Content Package Schema

on:
  pull_request:
    paths:
      - 'config/content-package.schema.json'
      - 'scripts/validate-content-package-schema.mjs'
      - 'src/types/content.ts'
      - 'package.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run content:schema:validate
      - run: npx tsc --noEmit
