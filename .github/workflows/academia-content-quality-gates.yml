name: Academia Content Quality Gates

on:
  pull_request:
    paths:
      - "content/**"
      - "data/**"
      - "config/**"
      - "src/**"
      - "public/**"
      - "supabase/functions/**"
      - "e2e/**"
      - "docs/**"
      - "scripts/validate-*.mjs"
      - "scripts/validate-academia-content-quality-gates.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/academia-content-quality-gates.yml"
  push:
    branches:
      - "feat/academia-core-redesign"
    paths:
      - "content/**"
      - "data/**"
      - "config/**"
      - "src/lib/**"
      - "src/pages/**"
      - "scripts/validate-*.mjs"
      - "scripts/validate-academia-content-quality-gates.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/academia-content-quality-gates.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content-quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run cross-pillar content validators
        run: npm run academia:content:quality-gates
