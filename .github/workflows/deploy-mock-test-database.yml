name: Deploy Mock Test Database

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-mock-test-database.yml"

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          supabase link \
            --project-ref "$SUPABASE_PROJECT_ID"

      - name: Show migration history
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase migration list

      - name: Repair remote-only migration history
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # These versions were confirmed by the diagnostic migration list:
          # they exist on production but have no corresponding local migration file.
          supabase migration repair --status reverted --yes \
            20260728010808 20260728140357 20260728142855 20260728144026 \
            20260728145340 20260728152558 20260728204325 20260728204336 \
            20260728205726 20260728210113 20260801095448 20260802025415 \
            20260803003901 20260803005633 20260804003828 20260804003933 \
            20260804003959 20260808120000 20260812120000 20260814010000 \
            20260814020000 20260815010000 20260815020000 20260815030000 \
            20260816010000

      - name: Apply database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase db push --yes
