name: Validate Assessment Bank Registration

on:
  pull_request:
    paths:
      - "config/assessment-registry.json"
      - "assessments/**"
      - "scripts/validate-assessment-registry.mjs"
      - "scripts/validate-assessment-bank-registration.mjs"
      - "package.json"
      - "scripts/validate-assessment-production-readiness.mjs"
      - "config/assessment-publication-audit.json"
      - "scripts/validate-assessment-publication-audit.mjs"
      - "config/assessment-version-history.json"
      - "scripts/validate-assessment-version-history.mjs"
      - "supabase/functions/assessment-attempt/index.ts"
      - "supabase/functions/assessment-question-content/index.ts"
      - "supabase/functions/assessment-answer/index.ts"
      - "supabase/functions/assessment-submit/index.ts"
      - "supabase/migrations/20261007120000_assessment_attempt_release_snapshot.sql"
      - "scripts/test-assessment-attempt-release-snapshot.mjs"
      - "scripts/test-assessment-attempt-integrity.mjs"
      - "scripts/test-assessment-attempt-deadline.mjs"
      - "scripts/test-assessment-attempt-state-machine.mjs"
      - "scripts/test-assessment-answer-write-integrity.mjs"
      - "scripts/test-server-authoritative-scoring.mjs"
      - "scripts/test-assessment-result-review-release.mjs"
      - "scripts/test-assessment-result-isolation.mjs"
      - "scripts/test-assessment-review-payload-minimization.mjs"
      - "scripts/test-assessment-attempt-lifecycle.mjs"
      - "scripts/test-assessment-retry-enforcement.mjs"
      - "scripts/test-assessment-analytics-integrity.mjs"
      - "config/assessment-retry-policy.json"
      - "scripts/validate-assessment-retry-policy.mjs"
      - "scripts/test-assessment-history-access.mjs"
      - "supabase/migrations/20261007170000_assessment_authoritative_scoring.sql"
      - "supabase/migrations/20261007160000_assessment_answer_atomic_write.sql"
      - "supabase/migrations/20261007150000_assessment_attempt_state_machine.sql"
      - "supabase/migrations/20261007140000_assessment_attempt_deadline.sql"
      - "supabase/migrations/20261007130000_assessment_attempt_integrity.sql"
      - "scripts/promote-assessment.mjs"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run content:assessment:bank:hash:test
      - run: npm run content:assessment:bank:path:test
      - run: npm run content:assessment:banks:validate
      - run: node scripts/validate-assessment-registry.mjs
      - run: npm run content:assessment:readiness:validate
      - run: npm run content:assessment:audit:validate
      - run: npm run content:assessment:versions:validate
      - run: npm run content:assessment:attempt:snapshot:test
      - run: npm run content:assessment:attempt:integrity:test
      - run: npm run content:assessment:attempt:deadline:test
      - run: npm run content:assessment:attempt:state:test
      - run: npm run content:assessment:answer:integrity:test
      - run: npm run content:assessment:scoring:test
      - run: npm run content:assessment:review:release:test
      - run: npm run content:assessment:result:isolation:test
      - run: npm run content:assessment:review:payload:test
      - run: npm run content:assessment:attempt:lifecycle:test
      - run: npm run content:assessment:retry:test
      - run: npm run content:assessment:analytics:test
      - run: npm run content:assessment:retry:validate
      - run: npm run content:assessment:history:test
