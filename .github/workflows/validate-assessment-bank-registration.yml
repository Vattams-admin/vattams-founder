name: Validate Assessment Bank Registration

on:
  pull_request:
    paths:
      - "config/assessment-registry.json"
      - "assessments/**"
      - "scripts/validate-assessment-registry.mjs"
      - "scripts/validate-assessment-bank-registration.mjs"
      - "package.json"
      - "scripts/validate-assessment-production-readiness.mjs"
      - "config/assessment-publication-audit.json"
      - "scripts/validate-assessment-publication-audit.mjs"
      - "config/assessment-version-history.json"
      - "scripts/validate-assessment-version-history.mjs"
      - "scripts/promote-assessment.mjs"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run content:assessment:bank:hash:test
      - run: npm run content:assessment:bank:path:test
      - run: npm run content:assessment:banks:validate
      - run: node scripts/validate-assessment-registry.mjs
      - run: npm run content:assessment:readiness:validate
      - run: npm run content:assessment:audit:validate
      - run: npm run content:assessment:versions:validate
