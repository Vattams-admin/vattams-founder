name: Validate Assessment Blueprint Registry

on:
  pull_request:
    paths:
      - "config/assessment-blueprint-registry.json"
      - "assessments/blueprint-registry.json"
      - "config/assessment-registry.json"
      - "scripts/validate-assessment-blueprint-registry.mjs"
      - "package.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run content:assessment:blueprint:validate
