name: Deploy Competition Runtime

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ljnfktzrjewqjxxchvud

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Supabase credentials
        run: test -n "$SUPABASE_ACCESS_TOKEN"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy official competition functions
        run: |
          set -euo pipefail
          for fn in             competition-official-attempt             competition-official-question-content             competition-official-scoring
          do
            supabase functions deploy "$fn"               --project-ref "$PROJECT_ID"               --use-api
          done

      - name: Deploy Mock Test functions
        run: |
          set -euo pipefail
          for fn in             competition-mock-attempt             competition-question-content             competition-mock-scoring
          do
            supabase functions deploy "$fn"               --project-ref "$PROJECT_ID"               --use-api
          done
