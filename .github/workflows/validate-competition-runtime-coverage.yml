name: Validate Competition Runtime Coverage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/catalog-data.mjs"
      - "scripts/validate-competition-runtime-coverage.mjs"
      - "config/competition-registry.json"
      - "supabase/functions/competition-mock-*/**"
      - "supabase/functions/competition-question-content/**"

jobs:
  runtime-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate competition runtime coverage
        run: node scripts/validate-competition-runtime-coverage.mjs
