name: Validate Competition MCQ Banks

on:
  workflow_dispatch:
  push:
    paths:
      - "data/competitions/**/full-bank/objective/**"
      - "scripts/validate-competition-mcq-bank.mjs"
      - "scripts/prepare-competition-runtime-sources.mjs"

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        slug:
          - mathematics-challenge
          - science-challenge
          - english-challenge
          - computer-challenge
          - gk-challenge
          - reasoning-challenge
          - india-gk-championship
          - national-quiz-championship
          - ai-technology-challenge
          - international-knowledge-challenge
          - national-mathematics-championship
          - national-science-championship
          - national-english-championship
          - national-aptitude-championship
          - national-coding-challenge
          - national-ai-challenge
          - mega-inter-school-championship
          - indian-classical-literature-wisdom-championship
          - indian-language-literature-masters-series
          - thirukkural
          - fun-with-maths-challenge
          - azhagu-tamil-challenge
          - handwriting-excellence-challenge
          - spoken-hindi-challenge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare runtime source
        id: prep
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node scripts/prepare-competition-runtime-sources.mjs --slug "${{ matrix.slug }}" 2>&1 | tee prep-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Validate MCQ bank
        id: validate
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node scripts/validate-competition-mcq-bank.mjs --slug "${{ matrix.slug }}" 2>&1 | tee validate-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Publish diagnostic issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          body="Competition: ${{ matrix.slug }}
Run: ${{ github.run_id }}

PREP:
$(cat prep-output.txt 2>/dev/null || true)

VALIDATION:
$(cat validate-output.txt 2>/dev/null || true)"
          curl -sS -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             https://api.github.com/repos/Vattams-admin/vattams-founder/issues             -d "$(python3 -c 'import json,sys; print(json.dumps({"title":"MCQ diagnostic ${{ matrix.slug }} run ${{ github.run_id }}","body":sys.stdin.read()}))' <<< "$body")" >/dev/null
