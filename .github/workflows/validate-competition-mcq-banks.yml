name: Validate Competition MCQ Banks

on:
  workflow_dispatch:
  push:
    paths:
      - "data/competitions/**/full-bank/objective/**"
      - "scripts/validate-competition-mcq-bank.mjs"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate all 24 MCQ banks and write failure report
        id: validate
        shell: bash
        run: |
          set +e
          mkdir -p reports
          : > reports/competition-mcq-validation-report.txt
          rc=0
          for slug in mathematics-challenge science-challenge english-challenge computer-challenge gk-challenge reasoning-challenge india-gk-championship national-quiz-championship ai-technology-challenge international-knowledge-challenge national-mathematics-championship national-science-championship national-english-championship national-aptitude-championship national-coding-challenge national-ai-challenge mega-inter-school-championship indian-classical-literature-wisdom-championship indian-language-literature-masters-series thirukkural fun-with-maths-challenge azhagu-tamil-challenge handwriting-excellence-challenge spoken-hindi-challenge; do
            echo "===== $slug =====" >> reports/competition-mcq-validation-report.txt
            node scripts/validate-competition-mcq-bank.mjs --slug "$slug" >> reports/competition-mcq-validation-report.txt 2>&1
            status=$?
            if [ $status -eq 0 ]; then
              echo "STATUS: PASS" >> reports/competition-mcq-validation-report.txt
            else
              echo "STATUS: FAIL ($status)" >> reports/competition-mcq-validation-report.txt
              rc=1
            fi
            echo >> reports/competition-mcq-validation-report.txt
          done
          echo "$rc" > reports/competition-mcq-validation-exit-code.txt
          cat reports/competition-mcq-validation-report.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Commit validation report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/competition-mcq-validation-report.txt
          git diff --cached --quiet && exit 0
          git commit -m "Record competition MCQ validation report [skip ci]"
          git push
      - name: Enforce validation gate
        run: |
          rc=$(cat reports/competition-mcq-validation-exit-code.txt)
          if [ "$rc" -ne 0 ]; then
            echo "Competition MCQ validation failed."
            exit 1
          fi
