name: Validate Competition MCQ Banks

on:
  workflow_dispatch:
  push:
    paths:
      - "data/competitions/**/full-bank/objective/**"
      - "scripts/validate-competition-mcq-bank.mjs"
      - "scripts/prepare-competition-runtime-sources.mjs"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        slug:
          - mathematics-challenge
          - science-challenge
          - english-challenge
          - computer-challenge
          - gk-challenge
          - reasoning-challenge
          - india-gk-championship
          - national-quiz-championship
          - ai-technology-challenge
          - international-knowledge-challenge
          - national-mathematics-championship
          - national-science-championship
          - national-english-championship
          - national-aptitude-championship
          - national-coding-challenge
          - national-ai-challenge
          - mega-inter-school-championship
          - indian-classical-literature-wisdom-championship
          - indian-language-literature-masters-series
          - thirukkural
          - fun-with-maths-challenge
          - azhagu-tamil-challenge
          - handwriting-excellence-challenge
          - spoken-hindi-challenge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare runtime source
        continue-on-error: true
        run: node scripts/prepare-competition-runtime-sources.mjs --slug "${{ matrix.slug }}"
      - name: Validate MCQ bank
        continue-on-error: true
        run: node scripts/validate-competition-mcq-bank.mjs --slug "${{ matrix.slug }}"
      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcq-diagnostic-${{ matrix.slug }}
          path: |
            prep-output.txt
            validate-output.txt
          if-no-files-found: ignore
