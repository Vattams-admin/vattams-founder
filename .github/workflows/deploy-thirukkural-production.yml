name: Deploy Thirukkural Production

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/competition-official-attempt/**"
      - "supabase/functions/competition-official-question-content/**"
      - "supabase/functions/competition-official-scoring/**"
      - "supabase/functions/competition-mock-attempt/**"
      - "supabase/functions/competition-mock-scoring/**"
      - "supabase/functions/competition-question-content/**"
      - "scripts/build-thirukkural-**"
      - "scripts/validate-thirukkural-production.mjs"
      - "scripts/package-thirukkural-production.mjs"
      - "data/thirukkural/**"
      - ".github/workflows/deploy-thirukkural-production.yml"

jobs:
  production:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Thirukkural production content
        run: npm run thirukkural:validate

      - name: Build Thirukkural production package
        run: npm run thirukkural:package

      - name: Link Supabase
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Apply database migrations
        run: supabase db push

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Thirukkural runtime functions
        run: |
          supabase functions deploy competition-mock-attempt --project-ref "$SUPABASE_PROJECT_ID" --use-api
          supabase functions deploy competition-mock-scoring --project-ref "$SUPABASE_PROJECT_ID" --use-api
          supabase functions deploy competition-question-content --project-ref "$SUPABASE_PROJECT_ID" --use-api
          supabase functions deploy competition-official-attempt --project-ref "$SUPABASE_PROJECT_ID" --use-api
          supabase functions deploy competition-official-question-content --project-ref "$SUPABASE_PROJECT_ID" --use-api
          supabase functions deploy competition-official-scoring --project-ref "$SUPABASE_PROJECT_ID" --use-api

      - name: Upload production competition assets
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"

          upload() {
            local file="$1"
            local object_path="$2"
            curl --fail-with-body --silent --show-error \
              -X POST "$SUPABASE_URL/storage/v1/object/academia-course-materials/$object_path" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "x-upsert: true" \
              -H "Content-Type: application/json" \
              --data-binary "@$file"
          }

          PACKAGE=".tmp-thirukkural-production"
          upload "$PACKAGE/registry.json" "competitions/registry.json"
          upload "$PACKAGE/competitions/thirukkural/objective/questions.private.json" "competitions/thirukkural/objective/questions.private.json"
          upload "$PACKAGE/competitions/thirukkural/objective/answer-keys.private.json" "competitions/thirukkural/objective/answer-keys.private.json"
          upload "$PACKAGE/competitions/thirukkural/objective/age-pools.json" "competitions/thirukkural/objective/age-pools.json"

      - name: Production asset smoke checks
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          for object_path in \
            "competitions/registry.json" \
            "competitions/thirukkural/objective/questions.private.json" \
            "competitions/thirukkural/objective/answer-keys.private.json" \
            "competitions/thirukkural/objective/age-pools.json"
          do
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              "$SUPABASE_URL/storage/v1/object/academia-course-materials/$object_path" >/dev/null
          done

      - name: Final status
        run: echo "THIRUKKURAL PRODUCTION DEPLOYMENT: PASS"
