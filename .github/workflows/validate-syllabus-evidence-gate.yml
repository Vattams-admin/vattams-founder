name: Validate Syllabus Evidence Gate

on:
  pull_request:
    paths:
      - "config/syllabus-evidence-registry.schema.json"
      - "scripts/validate-syllabus-evidence-schema.mjs"
      - "package.json"
  push:
    branches:
      - main
    paths:
      - "config/syllabus-evidence-registry.schema.json"
      - "scripts/validate-syllabus-evidence-schema.mjs"
      - "package.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run content:syllabus:evidence:validate
