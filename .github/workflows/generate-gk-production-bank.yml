name: Generate GK Production Bank

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/generate-gk-production-bank.mjs
      - .github/workflows/generate-gk-production-bank.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate authored GK bank
        run: node scripts/generate-gk-production-bank.mjs
      - name: Validate generated bank
        run: node scripts/validate-competition-mcq-bank.mjs gk-challenge
      - name: Commit generated production data
        run: |
          git config user.name "VATTAMS Academia Bot"
          git config user.email "vattamsacademia@gmail.com"
          git add data/competitions/gk-challenge/full-bank/objective/
          git diff --cached --quiet && exit 0
          git commit -m "Replace GK Challenge scaffold bank with authored MCQs"
          git push
