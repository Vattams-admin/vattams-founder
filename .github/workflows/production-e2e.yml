name: Production E2E

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/production-e2e.yml"

jobs:
  production-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production smoke tests
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: https://academia.vattams.net
          E2E_TUTOR_EMAIL: ${{ secrets.E2E_TUTOR_EMAIL }}
          E2E_TUTOR_PASSWORD: ${{ secrets.E2E_TUTOR_PASSWORD }}
          E2E_STUDENT_A_EMAIL: ${{ secrets.E2E_STUDENT_A_EMAIL }}
          E2E_STUDENT_A_PASSWORD: ${{ secrets.E2E_STUDENT_A_PASSWORD }}
          E2E_STUDENT_B_EMAIL: ${{ secrets.E2E_STUDENT_B_EMAIL }}
          E2E_STUDENT_B_PASSWORD: ${{ secrets.E2E_STUDENT_B_PASSWORD }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-e2e-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
