name: Production E2E

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "e2e/**"
      - "scripts/provision-production-e2e-v2.mjs"
      - "scripts/cleanup-production-e2e.mjs"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - "src/pages/CompetitionParticipant.tsx"
      - "src/components/competition/**"
      - "src/components/materials/**"
      - "supabase/functions/competition-official-*/**"
      - "supabase/functions/competition-mock-*/**"
      - ".github/workflows/production-e2e.yml"

jobs:
  production-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Wait for Cloudflare deployment to settle
        run: sleep 240
      - name: Cleanup previous failed E2E provisioning
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_STUDENT_A_EMAIL: e2e-student-a-37202984907@vattams-e2e.test
          E2E_STUDENT_B_EMAIL: e2e-student-b-37202984907@vattams-e2e.test
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          node scripts/cleanup-production-e2e.mjs
      - name: Provision isolated Firebase E2E student accounts
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          node scripts/provision-production-e2e-v2.mjs
      - name: Run production smoke tests
        run: npx playwright test e2e/production-smoke.spec.ts e2e/production-thirukkural.spec.ts e2e/production-assessment-security.spec.ts
        env:
          PLAYWRIGHT_BASE_URL: https://academia.vattams.net
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      - name: Cleanup isolated Firebase E2E data
        if: always()
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          node scripts/cleanup-production-e2e.mjs
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-e2e-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
