name: Production E2E

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - "src/pages/CompetitionParticipant.tsx"
      - "src/pages/live/LiveClassroom.tsx"
      - "src/hooks/useLiveWebRTC.ts"
      - "src/lib/liveRoom.ts"
      - "src/components/competition/**"
      - "src/components/materials/**"
      - "supabase/functions/competition-official-*/**"
      - "supabase/functions/competition-mock-*/**"
      - ".github/workflows/production-e2e.yml"

jobs:
  production-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Cleanup previous failed E2E provisioning
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          E2E_TUTOR_EMAIL: e2e-tutor-37202984907@vattams-e2e.test
          E2E_STUDENT_A_EMAIL: e2e-student-a-37202984907@vattams-e2e.test
          E2E_STUDENT_B_EMAIL: e2e-student-b-37202984907@vattams-e2e.test
          E2E_SESSION_ID: pO7n0obaGzi2NY2QYM0C
          E2E_COURSE_ID: e2e-live-course-37202984907
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          node scripts/provision-production-e2e-v2.mjs --cleanup

      - name: Provision isolated Firebase E2E accounts and live session
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          node scripts/provision-production-e2e-v2.mjs

      - name: Run production smoke tests
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: https://academia.vattams.net

      - name: Cleanup isolated Firebase E2E data
        if: always()
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          node scripts/provision-production-e2e-v2.mjs --cleanup

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-e2e-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
