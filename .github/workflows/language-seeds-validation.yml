name: Language Seed Validation

on:
  pull_request:
    paths:
      - "src/lib/globalLanguages.ts"
      - "src/lib/languageLearningSeeds.ts"
      - "scripts/validate-language-learning-seeds.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/language-seeds-validation.yml"
  push:
    branches:
      - "feat/academia-core-redesign"
    paths:
      - "src/lib/globalLanguages.ts"
      - "src/lib/languageLearningSeeds.ts"
      - "scripts/validate-language-learning-seeds.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/language-seeds-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-language-seeds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate language catalogue and starter seeds
        run: npm run languages:seeds:validate
