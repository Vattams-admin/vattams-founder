name: Deploy Official Competition Runtime

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/competition-official-attempt/**"
      - "supabase/functions/competition-official-question-content/**"
      - "supabase/functions/competition-official-scoring/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-official-competition.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ljnfktzrjewqjxxchvud
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: |
          supabase functions deploy competition-official-attempt             --project-ref "$PROJECT_ID"             --use-api

          supabase functions deploy competition-official-question-content             --project-ref "$PROJECT_ID"             --use-api

          supabase functions deploy competition-official-scoring             --project-ref "$PROJECT_ID"             --use-api
