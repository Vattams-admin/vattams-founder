name: Scan Assessment Blueprint Question Banks

on:
  pull_request:
    paths:
      - "config/assessment-blueprint-registry.json"
      - "config/assessment-blueprint-coverage/**"
      - "config/assessment-registry.json"
      - "assessments/**"
      - "scripts/scan-assessment-blueprint-question-banks.mjs"
      - "scripts/validate-assessment-blueprint-coverage.mjs"
      - "package.json"
      - "config/production-question-ingestion.schema.json"
      - "scripts/validate-production-question-ingestion.mjs"
      - "scripts/package-production-question-bank.mjs"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run content:assessment:coverage:scan
      - run: npm run content:assessment:coverage:validate
